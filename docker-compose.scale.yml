# Standalone stack: docker compose -p day12-scale -f docker-compose.scale.yml up -d --build --scale agent=3
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
  agent:
    build: .
    environment:
      PORT: "8000"
      AGENT_API_KEY: ${AGENT_API_KEY:?Set AGENT_API_KEY in .env}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 30s
  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      agent:
        condition: service_healthy
volumes:
  redis-data:
